name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a # v0
        with:
          nub-version: 0.8.3
          package-manager-cache: false
      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: 3.53.1
      - run: task setup
      - run: task deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_KV_ID: ${{ secrets.OAUTH_KV_ID }}
          PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN }}
          OWNER_KEY_HASH: ${{ secrets.OWNER_KEY_HASH }}
